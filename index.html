<!-- Deklarasi DOCTYPE untuk HTML5 -->
<!DOCTYPE html>
<!-- Elemen root HTML dengan bahasa Inggris -->
<html lang="en">

  <head>
    <!-- Set karakter encoding ke UTF-8 -->
    <meta charset="UTF-8" />
    <!-- Link ke favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Meta tag untuk responsivitas pada perangkat mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Judul halaman -->
    <title>Anggita</title>
  </head>
  <!-- Bagian body untuk konten halaman -->
  <body>
    <!-- Div root tempat React akan me-render aplikasi -->
    <div id="root"></div>
    <!-- Script untuk memuat modul main.jsx -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
